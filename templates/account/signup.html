<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        .error { color: red; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Регистрация</h2>

        <form method="post" action="{% url 'account_signup' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_email">Email:</label>
                <input type="email" name="email" id="id_email" required>
            </div>

            <div class="form-group">
                <label for="id_password1">Пароль:</label>
                <input type="password" name="password1" id="id_password1" required>
            </div>

            <div class="form-group">
                <label for="id_password2">Подтверждение пароля:</label>
                <input type="password" name="password2" id="id_password2" required>
            </div>

            {% if form.errors %}
                <div class="error">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            {{ error }}<br>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit">Зарегистрироваться</button>
        </form>

        <p style="margin-top: 20px;">
            Уже есть аккаунт? <a href="{% url 'account_login' %}">Войти</a>
        </p>
    </div>
</body>
</html>
