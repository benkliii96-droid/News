<!DOCTYPE html>
<html>
<head>
    <title>Вход в систему</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; margin-top: 5px; }
        .social-login { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; }
        .social-button { display: inline-block; padding: 10px 20px; background-color: #fc0; color: #000; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Вход в систему</h2>

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_login">Email:</label>
                <input type="email" name="login" id="id_login" required>
            </div>

            <div class="form-group">
                <label for="id_password">Пароль:</label>
                <input type="password" name="password" id="id_password" required>
            </div>

            {% if form.errors %}
                <div class="error">
                    Неверный email или пароль.
                </div>
            {% endif %}

            <button type="submit">Войти</button>
        </form>

        <div class="social-login">
            <h3>Или войдите через:</h3>
            <a href="{% url 'yandex_login' %}" class="social-button">Войти через Yandex</a>
        </div>

        <p style="margin-top: 20px;">
            Нет аккаунта? <a href="{% url 'account_signup' %}">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
